name: Validate Windows installer and release
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - '*.bat'
      - 'release.toml'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/**'
      - '.gitattributes'
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/release.py validate
      - run: python scripts/release.py dry-run
